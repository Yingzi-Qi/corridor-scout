name: Refresh dashboard data

on:
  schedule:
    - cron: "0 7 1 */3 *"
  workflow_dispatch:
    inputs:
      download_url:
        description: Same-schema workbook URL; leave blank to use the configured source
        required: false
      period:
        description: Optional period code such as 2025_3Q
        required: false

permissions:
  contents: write

concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh configured workbook
        env:
          DOWNLOAD_URL: ${{ inputs.download_url }}
          PERIOD: ${{ inputs.period }}
        run: |
          arguments=()
          if [[ -n "$DOWNLOAD_URL" ]]; then arguments+=(--download-url "$DOWNLOAD_URL"); fi
          if [[ -n "$PERIOD" ]]; then arguments+=(--period "$PERIOD"); fi
          python3 -m pipeline.run "${arguments[@]}"
      - run: pnpm run check
      - name: Publish changed data
        run: |
          git add public/corridor-data.json docs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh dashboard data"
          git push
